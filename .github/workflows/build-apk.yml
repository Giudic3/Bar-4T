name: Build Bar 4 Torri POS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout sorgenti
        uses: actions/checkout@v5

      - name: Verifica file del progetto
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "❌ ERRORE: Manca 'public/index.html'."
            exit 1
          fi

      - name: Configura Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verifica licenze Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Installa Capacitor e prepara progetto Android firmato
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npm run android:prepare

      - name: Compila APK Firmato (Aggiornabile senza disinstallare)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v5
        with:
          name: Bar4TorriPOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
